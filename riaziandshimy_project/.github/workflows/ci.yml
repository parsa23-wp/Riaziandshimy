name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.10", "3.12"] }
    defaults: { run: { working-directory: python/titration_sim } }
    env: { QT_QPA_PLATFORM: offscreen }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - run: pip install -e ".[ui,dev]" playwright && playwright install --with-deps chromium
      - run: pytest --cov --cov-report=term-missing
      - run: mypy titration_sim tests
      - run: python -m tests.browser.test_web_ext
  web-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: node --check every inline script of both HTML files
        run: |
          python3 - <<'PY'
          import re, subprocess, pathlib
          bad = 0
          for f in ("index.html", "titration-lab.html"):
              s = pathlib.Path(f).read_text(encoding="utf-8")
              for i, m in enumerate(re.finditer(r"<script>(.*?)</script>", s, re.S)):
                  pathlib.Path("/tmp/x.js").write_text(m.group(1), encoding="utf-8")
                  r = subprocess.run(["node", "--check", "/tmp/x.js"], capture_output=True, text=True)
                  if r.returncode: bad += 1; print(f, i, r.stderr[:300])
          raise SystemExit(bad)
          PY
