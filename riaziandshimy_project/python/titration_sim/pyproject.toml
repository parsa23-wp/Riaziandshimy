[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "titration-sim"
version = "1.0.0"
description = "Titration simulator: acid-base + redox/precipitation/EDTA/back engines, instrumental layers, potentiometric refinement (Berto et al. 2024) and a PyQt6 desktop UI for every family"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.scripts]
titration-sim = "titration_sim.ui.app:main"

[project.optional-dependencies]
ui = ["PyQt6>=6.6", "pyqtgraph>=0.13"]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-qt>=4.4", "mypy>=1.10"]

[tool.setuptools.packages.find]
include = ["titration_sim*"]

[tool.setuptools.package-data]
titration_sim = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "titration_sim"]
addopts = "--doctest-modules"


[tool.mypy]
python_version = "3.10"
strict = true
plugins = []

[[tool.mypy.overrides]]
module = ["pyqtgraph", "pyqtgraph.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["titration_sim"]

[tool.coverage.report]
# targets from the spec: engine >= 80 %, ui >= 60 %
show_missing = true
