name: Find and move index
on: [push]
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Find and Move
        run: |
          # پیدا کردن فایل index.html در هر جای مخزن و کپی کردنش به ریشه اصلی
          find . -name "index.html" -exec cp {} ./index.html \;
          
          # همین کار رو برای titration-lab.html هم انجام بده (اگر وجود داشت)
          find . -name "titration-lab.html" -exec cp {} ./titration-lab.html \;
          
          # کانفیگ گیت و پوش کردن تغییرات
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add .
          git commit -m "Auto-move HTML files to root" || true
          git push
